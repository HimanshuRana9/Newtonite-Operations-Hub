version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: newtonite_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: newtonite_ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newtonite_ops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
